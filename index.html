<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Vixora Digital Hub | Software, AI & Automation</title>
    <meta name="description" content="Build Smarter Businesses with Software, AI & Automation. Digital headquarters for custom software development, AI solutions, branding, media production, and Vixora Academy." />
    <meta property="og:title" content="Vixora Digital Hub | Software, AI & Automation" />
    <meta property="og:description" content="Build Smarter Businesses with Software, AI & Automation. Digital headquarters for custom software development, AI solutions, branding, media production, and Vixora Academy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F7FC] text-[#000048] font-sans antialiased selection:bg-[#480878] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Keep the Academy brand as a separate destination from the main Vixora Hub.
      document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target : null;
        const academyControl = target && target.closest('button, a');
        if (!academyControl) return;
        const label = (academyControl.textContent || '').trim();
        if (label === 'Academy' || label === 'All Academy Programs') {
          event.preventDefault();
          event.stopPropagation();
          window.location.href = 'https://academy.vixoradigitalhub.com';
        }
      }, true);
    </script>
  </body>
</html>
